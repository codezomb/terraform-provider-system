version: "3"

vars:
  TF_PROVIDER_NAME: system

  ACCTEST_TOFU_CLI_VERSION: 1.13.1

  BIN_PATH: ./.bin

includes:
  local:
    taskfile: ./Taskfile.local.yml
    optional: true

  test-alpine:
    taskfile: ./test/alpine/Taskfile.yml
    dir: ./test/alpine
  test-debian:
    taskfile: ./test/debian/Taskfile.yml
    dir: ./test/debian
  test-fedora:
    taskfile: ./test/fedora/Taskfile.yml
    dir: ./test/fedora

tasks:
  fmt:
    deps:
      - go-fmt

  go-fmt:
    # https://golang.org/cmd/gofmt/
    desc: Format Go source code
    cmds:
      - gofmt -w .

  go-fmt-check:
    desc: Checks if Go source code is formatted
    cmds:
      - 'gofmtout=$(gofmt -l .); [ -z "${gofmtout}" ] || { echo "detected malformatted go files" >&2; echo $gofmtout; exit 1; }'

  go-doc:
    desc: Run documentation server for Go programs
    cmds:
      - echo "Open documentation at http://127.0.0.1:10080/pkg/github.com/neuspaces/terraform-provider-system"
      - godoc -http "127.0.0.1:10080" -index -goroot .

  tofu-fmt:
    desc: Format OpenTofu code
    cmds:
      - tofu fmt -recursive examples/

  tf-provider-lint:
    desc: Lint of OpenTofu provider implementation
    cmds:
      - go run github.com/bflad/tfproviderlint/cmd/tfproviderlint -R001=false ./...
  
  tofu-cli-fetch:
    desc: Download OpenTofu CLI executable used by acceptance tests
    cmds:
      - mkdir -p {{.BIN_PATH}}/tofu-{{.ACCTEST_TOFU_CLI_VERSION}}
      - curl -s -L 'https://github.com/opentofu/opentofu/releases/download/v{{.ACCTEST_TOFU_CLI_VERSION}}/tofu_{{.ACCTEST_TOFU_CLI_VERSION}}_{{OS}}_{{ARCH}}.tar.gz' | tar -xz -C '{{.BIN_PATH}}/tofu-{{.ACCTEST_TOFU_CLI_VERSION}}' tofu
      - chmod 755 '{{.BIN_PATH}}/tofu-{{.ACCTEST_TOFU_CLI_VERSION}}/tofu'
    status:
      - test -f '{{.BIN_PATH}}/tofu-{{.ACCTEST_TOFU_CLI_VERSION}}/tofu'

  tofu-cli-link:
    desc: Enable the version of the OpenTofu CLI executable
    deps:
      - tofu-cli-fetch
    cmds:
      - ln -sf 'tofu-{{.ACCTEST_TOFU_CLI_VERSION}}/tofu' '{{.BIN_PATH}}/tofu'
    status:
      - test "tofu-{{.ACCTEST_TOFU_CLI_VERSION}}/tofu" = "$(readlink {{.BIN_PATH}}/tofu)"

  build:
    desc: Build provider executable
    env:
      CGO_ENABLED: 0
    cmds:
      - mkdir -p {{.BIN_PATH}}
      - go build -o {{.BIN_PATH}}/terraform-provider-{{.TF_PROVIDER_NAME}} .
    sources:
      - "**/*.go"
    generates:
      - '{{.BIN_PATH}}/terraform-provider-{{.TF_PROVIDER_NAME}}'

  testacc:
    desc: Run provider acceptance tests
    deps:
      - tofu-cli-link
    env:
      TF_ACC: true
      # The acceptance test framework runs the OpenTofu CLI and resolves the provider in the OpenTofu registry
      TF_ACC_TERRAFORM_PATH: '{{.ROOT_DIR}}/{{.BIN_PATH}}/tofu'
      TF_ACC_PROVIDER_HOST: registry.opentofu.org
    cmds:
      - go test -run '^TestAcc' github.com/neuspaces/terraform-provider-system/internal/provider

  test:
    desc: Run provider unit tests
    cmds:
      - go test -v ./...

  docs-validate:
    desc: Validate provider documentation using tfplugindocs
    cmds:
      - sh ./tools/tfplugindocs.sh validate

  docs-generate:
    desc: Generate provider documentation using tfplugindocs
    cmds:
      - sh ./tools/tfplugindocs.sh generate
